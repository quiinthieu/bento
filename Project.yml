name: Bento
configFiles:
  Debug: Config/Product.xcconfig
  Release: Config/Product.xcconfig
options:
  bundleIdPrefix: com.quiinthieu
  deploymentTarget:
    macOS: "15.0"
  minimumXcodeGenVersion: "2.38.0"
packages:
  BentoPackage:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  BentoMacApp:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    configFiles:
      Debug: Config/Product.xcconfig
      Release: Config/Product.xcconfig
    sources:
      - path: XcodeApp
    settings:
      base:
        ARCHS: "$(ARCHS_STANDARD)"
        PRODUCT_NAME: $(BENTO_PRODUCT_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(BENTO_BUNDLE_ID)
        MARKETING_VERSION: $(BENTO_VERSION)
        CURRENT_PROJECT_VERSION: $(BENTO_BUILD_NUMBER)
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: Config/Bento.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(BENTO_PRODUCT_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Uyen Thieu. Released under the MIT License."
        INFOPLIST_KEY_SUFeedURL: $(SPARKLE_FEED_URL)
        INFOPLIST_KEY_SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        INFOPLIST_KEY_SUEnableAutomaticChecks: NO
        INFOPLIST_KEY_BentoEnableSparkle: $(BENTO_ENABLE_SPARKLE)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_IDENTITY: $(CODE_SIGN_IDENTITY)
        CODE_SIGN_STYLE: $(CODE_SIGN_STYLE)
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO
    dependencies:
      - package: BentoPackage
        product: BentoUI
      - package: BentoPackage
        product: BentoCore
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      - name: Embed Companion CLI in Contents/Helpers
        script: '"${SRCROOT}/Scripts/embed-cli.sh"'
        basedOnDependencyAnalysis: false
  BentoMacAppUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    configFiles:
      Debug: Config/Product.xcconfig
      Release: Config/Product.xcconfig
    sources:
      - path: XcodeUITests
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(BENTO_BUNDLE_ID).uitests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BentoMacApp
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: BentoMacApp
schemes:
  BentoMacApp:
    build:
      targets:
        BentoMacApp: all
        BentoMacAppUITests: [test]
    test:
      targets:
        - BentoMacAppUITests
