# Codex TOML config with secrets that must be redacted at parse time
model = "gpt-5-codex"
project_doc_max_bytes = 32768
api_key = "TEST_SYNTHETIC_APIKEY_FOXTROT_06"

[auth]
refresh_token = "TEST_SYNTHETIC_TOKEN_ECHO_05"
client_secret = "TEST_SYNTHETIC_SECRET_ALPHA_01"
proxy_password = "TEST_SYNTHETIC_PASSWORD_DELTA_04"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
enabled = true

[mcp_servers.github.env]
CUSTOM_UPSTREAM_CREDS = "TEST_SYNTHETIC_MCP_ENV_BRAVO_02"

[mcp_servers.remote]
url = "https://mcp.example.com/sse"

[mcp_servers.remote.http_headers]
Authorization = "Bearer TEST_SYNTHETIC_BEARER_GOLF_07"
X-Team-Context = "TEST_SYNTHETIC_HEADER_CHARLIE_03"
